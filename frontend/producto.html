<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto | Hyper Distric</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="./index.html" class="logo">
      <img src="./img/logo.webp" alt="Hyper Distric Logo">
      <span>Hyper Distric</span>
    </a>

    <nav class="nav-links">
      <a href="./index.html#inicio">Inicio</a>
      <a href="./index.html#categorias">Categorías</a>
      <a href="./index.html#destacados">Destacados</a>
      <a href="./index.html#catalogo">Catálogo</a>
      <a href="./carrito.html">Carrito</a>
      <a href="./index.html#contacto">Contacto</a>
      <a href="./login.html">Login</a>
    </nav>
  </header>

  <main class="detalle-main">
    <section class="detalle-producto">
      <div class="detalle-grid">
        <div class="detalle-imagen-columna">
          <div class="detalle-imagen-box">
            <img id="detalle-imagen" src="" alt="">
          </div>
        </div>

        <div class="detalle-info-columna">
          <div id="breadcrumb-producto" class="breadcrumb-producto"></div>
          <div id="detalle-info" class="detalle-info"></div>
        </div>
      </div>
    </section>

    <section class="detalle-extra">
      <div class="detalle-bloque">
        <p class="section-label">Detalles del producto</p>
        <h2>Información del producto</h2>
        <div id="detalle-tecnico" class="detalle-tecnico-grid"></div>
      </div>

      <div class="detalle-bloque">
        <p class="section-label">Productos relacionados</p>
        <h2>Sigue explorando Hyper Distric</h2>
        <div id="productos-relacionados" class="grid-productos-relacionados"></div>
      </div>
    </section>
  </main>

  <script src="./js/producto.js"></script>
  <script src="./js/nav-auth.js"></script>
</body>
</html>
